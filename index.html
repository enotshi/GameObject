<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Tuanjie WebGL Player | Escape_from_the_Earth</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* 整体布局：垂直居中，底部留白 */
      body {
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #0a0f2a, #0b1a3a);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      /* 游戏容器：画布带圆角和阴影 */
      #tuanjie-container {
        background: black;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        line-height: 0;  /* 消除 inline 间隙 */
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      /* 底部工具栏：宽度与画布一致，美观居下 */
      #tuanjie-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 1000px;           /* 与 canvas 宽度一致 */
        max-width: 100%;         /* 移动端自适应 */
        margin-top: 16px;
        padding: 8px 20px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        border-radius: 40px;
        box-sizing: border-box;
        color: rgba(255,255,255,0.8);
        font-size: 14px;
      }

      /* 全屏按钮样式（保持可点） */
      #tuanjie-fullscreen-button {
        cursor: pointer;
        background: rgba(255,255,255,0.2);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      #tuanjie-fullscreen-button:hover {
        background: rgba(255,255,255,0.4);
      }
      #tuanjie-fullscreen-button::after {
        content: "⛶";
        font-size: 20px;
        color: white;
      }

      /* 加载进度条样式（保留原有功能） */
      #tuanjie-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        text-align: center;
      }
      #tuanjie-progress-bar-empty {
        background: rgba(255,255,255,0.3);
        border-radius: 10px;
        height: 8px;
      }
      #tuanjie-progress-bar-full {
        background: #4caf50;
        width: 0%;
        height: 100%;
        border-radius: 10px;
      }

      /* 隐藏不需要的元素
      #tuanjie-logo, #tuanjie-webgl-logo {
        display: none;
      } */

      /* 移动端适配 */
      @media (max-width: 1000px) {
        #tuanjie-footer {
          width: calc(100% - 40px);
          margin-top: 12px;
          padding: 6px 16px;
        }
        body {
          padding: 12px;
        }
      }
      .game-rules {
        background: rgba(0,0,0,0.7);
        color: white;
        border-radius: 16px;
        padding: 12px 20px;
        margin-bottom: 20px;
        backdrop-filter: blur(8px);
        font-size: 14px;
        max-width: 1000px;
        width: 100%;
        box-sizing: border-box;
      }
      .game-rules h3 {
        margin: 0 0 8px 0;
        font-size: 18px;
      }
      .game-rules ul {
        margin: 0;
        padding-left: 20px;
      }
      .game-rules li {
        margin: 4px 0;
        line-height: 1.4;
      }
      kbd {
        background: #333;
        border-radius: 4px;
        padding: 2px 6px;
        font-family: monospace;
        font-size: 0.9em;
        box-shadow: 0 1px 0 rgba(255,255,255,0.2);
        margin: 0 2px;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 20px; align-items: flex-start;"></div>
      <div id="tuanjie-container" class="tuanjie-desktop">
        <div class="game-rules">
          <h3>📜 游戏规则</h3>
          <ul>
            <li>🎯 你无法主动跳跃，必须抛射<strong>支点</strong>并利用<strong>对称跳跃</strong>移动。</li>
            <li>🖱️ <strong>鼠标瞄准</strong> → 按 <kbd>E</kbd> / <kbd>空格</kbd> 抛射支点（消耗1个支点）。</li>
            <li>🪄 支点飞行中或落地后0.5秒内，按 <kbd>W</kbd> / <kbd>R</kbd> 进行<strong>对称跳跃</strong>（以支点为中心瞬间镜像移动）。</li>
            <li>❤️ 触碰尖刺或掉落深渊会扣血，生命归零则本关重置。</li>
            <li>🚪 每个关卡需要跳入上方的<strong>传送门</strong>才能进入下一关。</li>
            <li>📦 拾取<strong>支点包</strong>补充支点数量，<strong>生命水晶</strong>恢复生命。</li>
            <li>✨ <strong>简单模式</strong>会显示抛物线辅助线，<strong>普通模式</strong>无辅助线且无支点时倒计时重置关卡。</li>
          </ul>
        </div>
        <canvas id="tuanjie-canvas" width=1000 height=750 tabindex="-1"></canvas>
        <div id="tuanjie-loading-bar">
          <div id="tuanjie-logo"></div>
          <div id="tuanjie-progress-bar-empty">
            <div id="tuanjie-progress-bar-full"></div>
          </div>
        </div>
        <div id="tuanjie-warning"> </div>
      </div>
      <div id="tuanjie-footer">
        <div id="tuanjie-webgl-logo"></div>
        <div id="tuanjie-fullscreen-button"></div>
        <div id="tuanjie-build-title">Escape_from_the_Earth</div>
      </div>
    
	
	
    <script>

      var container = document.querySelector("#tuanjie-container");
      var canvas = document.querySelector("#tuanjie-canvas");
      var loadingBar = document.querySelector("#tuanjie-loading-bar");
      var progressBarFull = document.querySelector("#tuanjie-progress-bar-full");
      var fullscreenButton = document.querySelector("#tuanjie-fullscreen-button");
      var warningBanner = document.querySelector("#tuanjie-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Pak.loader.js";
      var config = {
        dataUrl: buildUrl + "/Pak.data.unityweb",
        frameworkUrl: buildUrl + "/Pak.framework.js.unityweb",
        codeUrl: buildUrl + "/Pak.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GameObject",
        productName: "Escape_from_the_Earth",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Tuanjie keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "tuanjie-mobile";
        canvas.className = "tuanjie-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "1000px";
        canvas.style.height = "750px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createTuanjieInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((tuanjieInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  tuanjieInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
